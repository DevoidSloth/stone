name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Ship whichever platform succeeds rather than losing both to one failure.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            script: dist:win
          - os: macos-latest
            name: macOS
            script: dist:mac

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # macOS records calendar permission against the app's code signature. With
      # no certificate there is nothing stable to record, so the grant is pinned
      # to the binary's cdhash and every release silently revokes the access the
      # previous one was given. The certificate must therefore be the SAME one
      # every release — generating a fresh one per build is no better than
      # shipping unsigned.
      #
      # Export the local certificate once and store it as a repository secret:
      #
      #   security export -t identities -f pkcs12 \
      #     -k ~/Library/Keychains/login.keychain-db \
      #     -o stone-signing.p12 -P '<password>'
      #   base64 -i stone-signing.p12 | pbcopy
      #
      # then set MACOS_SIGNING_CERT (the base64) and MACOS_SIGNING_CERT_PASSWORD.
      - name: Import signing certificate
        # `secrets` can't be read from an `if:` — it isn't resolved yet when
        # that's evaluated — so the presence check happens in the script below
        # instead, against the env var it's copied into.
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERT: ${{ secrets.MACOS_SIGNING_CERT }}
          MACOS_SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_CERT" ]; then
            echo "No MACOS_SIGNING_CERT secret set; skipping certificate import."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$MACOS_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          # The signing script reads the default search list, so the new
          # keychain has to join it rather than replace it.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build and package
        run: npm run ${{ matrix.script }}
        env:
          # Signing is done by scripts/sign-mac.mjs, not by electron-builder, so
          # its own identity discovery stays off.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Stone $TAG" \
            --notes-file - artifacts/* <<'NOTES'
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Intel + Apple Silicon) | `Stone-*.dmg` |
          | Windows x64 | `Stone-*-x64.exe` |
          | Windows ARM64 | `Stone-*-arm64.exe` |

          These builds are **unsigned** — there is no Apple Developer ID or
          Windows code-signing certificate behind them.

          - **macOS:** Gatekeeper will refuse the first launch. Right-click the
            app in Applications and choose Open, or run
            `xattr -dr com.apple.quarantine /Applications/Stone.app`.
          - **Windows:** SmartScreen shows "Windows protected your PC". Choose
            More info, then Run anyway.
          NOTES
