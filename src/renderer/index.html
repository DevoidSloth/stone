<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Everything is bundled locally, so the renderer never needs the network.
      This CSP makes that a guarantee rather than a habit.

      `stone-file:` is Stone's own scheme, handled in main and resolved strictly
      inside the open vault — or, for the document library, inside the folders
      you explicitly asked Stone to watch. It is how embedded images load, and
      how a PDF reaches Chromium's viewer, without granting the renderer the
      whole filesystem the way `file:` would.

      `frame-src` is listed for that PDF viewer alone. Note what is still
      withheld: `script-src` remains `'self'`, so nothing loaded over the scheme
      can execute, and there is no network origin anywhere in this policy.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: stone-file:; media-src 'self' stone-file:; frame-src stone-file:; worker-src 'self' blob:; connect-src 'self' stone-file:"
    />
    <title>Stone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
