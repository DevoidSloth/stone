appId: com.stone.app
productName: Stone
copyright: Stone

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  # Shipped so the running window can set its own icon; electron-builder also
  # derives the .ico and .icns from this same file at package time.
  - build/icon.png
  - '!**/*.map'

asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Stone

# `stone://` links, so the clipper and any script can hand work to a running
# instance. Declared per platform because each one registers schemes its own way.
protocols:
  - name: Stone
    schemes: [stone]

# Without a declared document type nothing offers Stone for a file: Finder's
# "Open with" and "Change All…" grey it out, and it can never be the default.
# `role: Editor` because Stone writes these files back, not just displays them.
fileAssociations:
  - ext: md
    name: Markdown document
    description: Markdown document
    mimeType: text/markdown
    role: Editor
  - ext: markdown
    name: Markdown document
    description: Markdown document
    mimeType: text/markdown
    role: Editor

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.productivity
  darkModeSupport: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing is handled by scripts/sign-mac.mjs instead of by electron-builder.
  # electron-builder validates the trust chain of a signing identity and skips
  # signing entirely when it cannot build one, which is what a self-signed
  # certificate always looks like. An unsigned app is the cause of a TCC
  # permission grant resetting on every update: with no certificate to anchor
  # to, macOS pins the grant to the binary's cdhash, which every build changes.
  identity: null

afterPack: scripts/sign-mac.mjs

dmg:
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: Office

# Where `electron-updater` looks for `latest-mac.yml` and the blockmap that
# electron-builder is already producing. Without this the release workflow
# builds updates nothing can find.
publish:
  provider: github
  owner: DevoidSloth
  repo: stone
