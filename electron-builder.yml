appId: com.stone.app
productName: Stone
copyright: Stone

directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  # Shipped so the running window can set its own icon; electron-builder also
  # derives the .ico and .icns from this same file at package time.
  - build/icon.png
  - '!**/*.map'

asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Stone

# `stone://` links, so the clipper and any script can hand work to a running
# instance. Declared per platform because each one registers schemes its own way.
protocols:
  - name: Stone
    schemes: [stone]

mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.productivity
  darkModeSupport: true
  # EventKit access is refused without a usage string, which is how Stone reads
  # and writes Apple Calendar.
  extendInfo:
    NSCalendarsUsageDescription: Stone shows your Apple Calendar events alongside your notes and tasks, and writes events you create in Stone back to Calendar.
    NSCalendarsFullAccessUsageDescription: Stone shows your Apple Calendar events alongside your notes and tasks, and writes events you create in Stone back to Calendar.
    NSRemindersUsageDescription: Stone can mirror tasks into Reminders.
    NSAppleEventsUsageDescription: Stone uses Apple Events to read your calendars through EventKit.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing is handled by scripts/sign-mac.mjs instead of by electron-builder.
  # electron-builder validates the trust chain of a signing identity and skips
  # signing entirely when it cannot build one, which is what a self-signed
  # certificate always looks like. An unsigned app is the cause of the calendar
  # permission resetting on every update: with no certificate to anchor to,
  # macOS pins the TCC grant to the binary's cdhash, which every build changes.
  identity: null

afterPack: scripts/sign-mac.mjs

dmg:
  artifactName: ${productName}-${version}.${ext}

linux:
  target:
    - AppImage
  category: Office
